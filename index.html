<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Formulários - Unilog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
  <div class="app">
    <header class="header">
      <img src="assets/logo-unilog.png" alt="Unilog" class="logo" />
      <div class="header-text">
        <h1>Central de Formulários</h1>
        <p>Acesso rápido aos formulários operacionais</p>
      </div>
    </header>

    <section class="search-section">
      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" placeholder="Buscar formulário..." />
      </div>
    </section>

    <section id="catalogo" class="catalogo"></section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

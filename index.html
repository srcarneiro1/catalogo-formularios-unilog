<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#494a56"
  >

  <title>Central de Formulários | Unilog Express</title>

  <!-- Roboto -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <!-- Google Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css?v=20260814-3"
  >
</head>

<body>

  <main class="app">

    <!-- CABEÇALHO -->
    <header class="header">

      <div class="logo-container">
        <img
          src="assets/logo-unilog.png"
          alt="Unilog Express"
          class="logo"
        >
      </div>

      <div class="header-text">
        <h1>Central de Formulários</h1>

        <p>
          Acesso rápido aos formulários operacionais
        </p>
      </div>

    </header>


    <!-- BUSCA -->
    <section
      class="search-section"
      aria-label="Pesquisa de formulários"
    >

      <div class="search-box">

        <span
          class="material-symbols-outlined search-icon"
          aria-hidden="true"
        >
          search
        </span>

        <input
          type="search"
          id="searchInput"
          placeholder="Buscar formulário..."
          autocomplete="off"
          aria-label="Buscar formulário"
        >

        <button
          type="button"
          id="clearSearch"
          class="clear-search"
          aria-label="Limpar pesquisa"
          title="Limpar pesquisa"
        >
          <span class="material-symbols-outlined">
            close
          </span>
        </button>

      </div>

    </section>


    <!-- CATÁLOGO -->
    <section
      id="catalogo"
      class="catalogo"
      aria-live="polite"
    >

      <div class="estado">
        Carregando formulários...
      </div>

    </section>


    <!-- RODAPÉ -->
    <footer class="footer">
      <span>UNILOG EXPRESS</span>
    </footer>

  </main>


  <!-- APLICAÇÃO -->
  <script src="app.js?v=20260814-4"></script>

</body>

</html>

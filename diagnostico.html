<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diagnóstico do Catálogo</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #494a56;
    }

    .box {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #dde1e6;
      border-radius: 16px;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .linha {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      word-break: break-word;
    }

    .ok {
      color: #137333;
      font-weight: 700;
    }

    .erro {
      color: #b3261e;
      font-weight: 700;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Diagnóstico do Catálogo</h1>
    <div id="status"></div>
  </div>

  <script>
    var statusEl = document.getElementById("status");
    var terminou = false;

    function registrar(texto, classe) {
      var div = document.createElement("div");
      div.className = "linha" + (classe ? " " + classe : "");
      div.textContent = texto;
      statusEl.appendChild(div);
    }

    registrar("1. Página de diagnóstico carregada.", "ok");
    registrar("2. JavaScript local executado.", "ok");

    window.testeJSONP = function (dados) {
      terminou = true;

      registrar("4. Callback JSONP executado.", "ok");

      if (Array.isArray(dados)) {
        registrar("5. API retornou " + dados.length + " formulário(s).", "ok");

        var pre = document.createElement("pre");
        pre.textContent = JSON.stringify(dados, null, 2);
        statusEl.appendChild(pre);
      } else {
        registrar("5. A resposta não é uma lista válida.", "erro");
      }
    };

    var api = "https://script.google.com/macros/s/AKfycbyv2A1g7eDeUYWGA5v-ifRCnH9okVB8v0HV2p3FK-7btvTKjflU_QyyxQMjJe7qp_qtPw/exec";
    var src = api + "?callback=testeJSONP&t=" + new Date().getTime();

    registrar("3. Solicitando JSONP do Apps Script...");

    var script = document.createElement("script");
    script.src = src;
    script.async = true;

    script.onerror = function () {
      terminou = true;
      registrar("ERRO: o Safari/WebView não conseguiu carregar o Apps Script como script externo.", "erro");
    };

    document.body.appendChild(script);

    setTimeout(function () {
      if (!terminou) {
        registrar("ERRO: o script externo não chamou o callback em até 12 segundos.", "erro");
      }
    }, 12000);
  </script>
</body>
</html>
